# =============================================================================
# MIRROR-SERVER CI/CD PIPELINE
# =============================================================================
# Enterprise-grade pipeline for the Mirror backend API + worker processes.
#
# TRIGGERS:
#   - Push to master or develop → full pipeline + deploy
#   - Pull request to master or develop → quality gates only (no deploy)
#   - Manual dispatch → full pipeline with optional deploy
#
# QUALITY GATES:
#   1. Dependency install (deterministic via npm ci)
#   2. TypeScript strict type-check (tsc --noEmit)
#   3. Full production build (tsc → dist/)
#   4. Security audit (npm audit)
#   5. Secret scanning (prevent accidental credential commits)
#
# DEPLOYMENT:
#   - SSH into production server as mirror_app
#   - Git pull → npm ci → build → PM2 hard restart all 6 processes
#   - Worker-online verification (catches workers that fail at startup)
#   - HTTP health check verification with automatic rollback on failure
#   - Git tag + GitHub Release on success
#
# WHY pm2 restart vs reload:
#   `restart` is hard-kill + respawn for every process in
#   ecosystem.config.js. Bulletproof protection against lingering Redis pub/sub
#   subscriptions, hung worker shutdown handlers, or any stuck state
#   that survives a graceful SIGINT. User-perceived impact is minimal
#   because client-side WebSocket reconnect + HTTP retry covers the
#   ~1s gap per process; queue workers never affect user requests
#   directly. The graceful zero-downtime "reload" path occasionally
#   left workers in inconsistent state (notification system stopped
#   firing — tracked down via "pm2 restart all" manually fixing it).
# =============================================================================

name: Mirror Server CI/CD

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Force deploy to production'
        required: false
        type: boolean
        default: false

# Prevent concurrent deployments — queue new runs, cancel redundant PR checks
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'

jobs:
  # ===========================================================================
  # JOB 1: QUALITY GATES
  # ===========================================================================
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check (strict)
        run: npx tsc --noEmit

      # BLOCKING: the pure unit suites (IDOR guards, intake completion/derivation,
      # entry validation, audience resolver, student config/domain). A failure
      # here fails the pipeline and blocks deploy — these are the regressions that
      # previously reached production unnoticed because CI ran no tests.
      - name: Unit tests
        run: npm run test:ci

      - name: Build production artifacts
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Scan for secrets in code
        run: |
          echo "Scanning for potential secrets..."
          PATTERNS='(password|secret|api_key|private_key|token)\s*[:=]\s*["\x27][^"\x27]{8,}'
          if grep -rniE "$PATTERNS" --include="*.ts" --include="*.js" --include="*.json" \
            --exclude-dir=node_modules --exclude-dir=dist \
            --exclude="package-lock.json" --exclude="*.d.ts" . ; then
            echo "::warning::Potential hardcoded secrets detected. Review the matches above."
          else
            echo "No hardcoded secrets detected."
          fi

      - name: Verify build artifacts exist
        run: |
          if [ ! -f "dist/index.js" ]; then
            echo "::error::Build failed — dist/index.js not found"
            exit 1
          fi
          echo "Build artifacts verified:"
          ls -la dist/
          echo ""
          echo "Worker artifacts:"
          ls -la dist/workers/ 2>/dev/null || echo "No workers directory (may be expected)"

  # ===========================================================================
  # JOB 2: DEPLOY TO PRODUCTION
  # ===========================================================================
  deploy:
    name: Deploy to Production
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')

    environment:
      name: production
      url: https://theundergroundrailroad.world/mirror/api/health

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Create pre-deploy snapshot
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'DEPLOY_SNAPSHOT'
          cd ${{ secrets.SERVER_DEPLOY_PATH }}

          # Tag current state for rollback
          CURRENT_COMMIT=$(git rev-parse HEAD)
          echo "Pre-deploy commit: $CURRENT_COMMIT"

          # Save commit hash for rollback
          echo "$CURRENT_COMMIT" > /tmp/.mirror-server-rollback-commit
          DEPLOY_SNAPSHOT

      - name: Deploy mirror-server
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'DEPLOY_SCRIPT'
          set -e

          echo "=========================================="
          echo "  MIRROR-SERVER DEPLOYMENT"
          echo "  $(date '+%Y-%m-%d %H:%M:%S')"
          echo "=========================================="

          cd ${{ secrets.SERVER_DEPLOY_PATH }}

          # Step 1: Pull latest code
          echo "[1/6] Pulling latest code..."
          git fetch origin master
          git reset --hard origin/master

          # Step 2: Install all dependencies (dev needed for @types during build)
          echo "[2/6] Installing dependencies..."
          npm ci

          # Step 3: Build TypeScript
          echo "[3/6] Building TypeScript..."
          npm run build

          # Step 4: Verify build output
          echo "[4/6] Verifying build..."
          if [ ! -f "dist/index.js" ]; then
            echo "ERROR: Build failed — dist/index.js missing!"
            exit 1
          fi

          # Step 5: Prune devDependencies for production
          echo "[5/6] Pruning dev dependencies..."
          npm prune --omit=dev

          # Step 6: Hard restart all 6 PM2 processes (was 'reload', changed
          # to 'restart' for bulletproof reload — graceful path occasionally
          # left workers in inconsistent state).
          echo "[6/6] Restarting PM2 processes..."
          sudo pm2 restart ecosystem.config.js

          echo ""
          echo "Deploy complete. Waiting for processes to stabilize..."
          sleep 15

          # Show process status
          sudo pm2 list
          DEPLOY_SCRIPT

      - name: Verify all PM2 processes are online
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'PM2_CHECK'
          set -e
          # Verify each process listed in ecosystem.config.js is in 'online'
          # state. A worker that fails at startup (bad import, env var
          # missing, etc.) won't be caught by the HTTP health check below
          # — it would just sit in 'errored' state until users notice
          # missing notifications / unprocessed queue items.
          OFFLINE=$(sudo pm2 jlist | python3 -c "
          import json, sys
          procs = json.load(sys.stdin)
          expected = {'mirror-server', 'analysis-worker', 'dina-chat-worker', 'truthstream-worker', 'personal-analysis-worker', 'email-campaign-worker'}
          alive = {p['name'] for p in procs if p['pm2_env']['status'] == 'online'}
          missing = expected - alive
          dead = [(p['name'], p['pm2_env']['status']) for p in procs if p['name'] in expected and p['pm2_env']['status'] != 'online']
          out = list(missing) + [f\"{n}({s})\" for n, s in dead]
          if out:
            print(' '.join(out))
          ")
          if [ -n "$OFFLINE" ]; then
            echo "::error::Processes not online after restart: $OFFLINE"
            sudo pm2 list
            exit 1
          fi
          echo "All 6 PM2 processes are online."
          PM2_CHECK

      - name: Health check
        id: health_check
        run: |
          echo "Running health check..."
          # 12 retries × 5s + initial sleep = up to ~75s grace period.
          # Cold restart with Redis/MySQL/DINA reconnect can take longer
          # than the previous 30s budget, especially if DINA's WebSocket
          # is briefly unreachable during its own deploy.
          MAX_RETRIES=12
          RETRY_INTERVAL=5

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES..."

            HTTP_CODE=$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
              "curl -sk -o /dev/null -w '%{http_code}' https://localhost:\${MIRRORPORT:-8444}/mirror/api/health" \
              2>/dev/null || echo "000")

            echo "Health check response: HTTP $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "health_status=healthy" >> $GITHUB_OUTPUT
              echo "Health check PASSED"
              exit 0
            fi

            if [ "$i" -lt "$MAX_RETRIES" ]; then
              echo "Retrying in ${RETRY_INTERVAL}s..."
              sleep $RETRY_INTERVAL
            fi
          done

          echo "health_status=unhealthy" >> $GITHUB_OUTPUT
          echo "::error::Health check FAILED after $MAX_RETRIES attempts"
          exit 1

      - name: Rollback on failure
        if: failure() && steps.health_check.outputs.health_status == 'unhealthy'
        run: |
          echo "::error::DEPLOYING ROLLBACK..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ROLLBACK_SCRIPT'
          set -e
          cd ${{ secrets.SERVER_DEPLOY_PATH }}

          ROLLBACK_COMMIT=$(cat /tmp/.mirror-server-rollback-commit 2>/dev/null)
          if [ -z "$ROLLBACK_COMMIT" ]; then
            echo "ERROR: No rollback commit found!"
            exit 1
          fi

          echo "Rolling back to commit: $ROLLBACK_COMMIT"
          git checkout "$ROLLBACK_COMMIT"
          npm ci --production
          npm run build
          # Hard restart on rollback too — same reasoning as the deploy
          # step (defends against stuck state in workers).
          sudo pm2 restart ecosystem.config.js

          echo "Rollback complete. Waiting for stabilization..."
          sleep 15
          sudo pm2 list
          ROLLBACK_SCRIPT

      - name: Tag release
        if: success()
        run: |
          # Generate version from date + short SHA
          VERSION="v$(date +'%Y.%m.%d')-${GITHUB_SHA::7}"
          git tag "$VERSION"
          git push origin "$VERSION"
          echo "Tagged release: $VERSION"

      - name: Create GitHub Release
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const version = `v${new Date().toISOString().slice(0,10).replace(/-/g,'.')}-${context.sha.slice(0,7)}`;
            const commits = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 10
            });
            const changelog = commits.data
              .slice(0, 5)
              .map(c => `- ${c.commit.message.split('\n')[0]}`)
              .join('\n');

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: version,
              name: `Mirror Server ${version}`,
              body: `## Deployment\n- **Date**: ${new Date().toISOString()}\n- **Commit**: ${context.sha}\n- **Triggered by**: ${context.actor}\n\n## Recent Changes\n${changelog}`,
              draft: false,
              prerelease: false
            });

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
  # ===========================================================================
  # JOB 3: DEPLOY TO STAGING  (staging pipeline gate 3)
  # ---------------------------------------------------------------------------
  # Runs on push to `develop`, but ONLY once staging has been provisioned and the
  # repo variable STAGING_ENABLED is set to 'true' (see docs/STAGING.md). Until
  # then this job is skipped, so merging the pipeline changes disrupts nothing.
  #
  # Same proven SSH+PM2 pattern as the prod deploy, targeting the ISOLATED staging
  # stack: a separate checkout (STAGING_DEPLOY_PATH) tracking develop, its own
  # .env (mirror_staging DB, port 9444, distinct secrets), and staging PM2 apps
  # (ecosystem.staging.config.js -> *-staging).
  # ===========================================================================
  deploy-staging:
    name: Deploy to Staging
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.STAGING_ENABLED == 'true'
    environment:
      name: staging
      url: https://127.0.0.1:9444/mirror/api/health

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Snapshot staging for rollback
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'SNAP'
          cd ${{ secrets.STAGING_DEPLOY_PATH }}
          git rev-parse HEAD > /tmp/.mirror-server-staging-rollback-commit
          SNAP

      - name: Deploy mirror-server (staging)
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'DEPLOY'
          set -e
          cd ${{ secrets.STAGING_DEPLOY_PATH }}
          echo "[1/5] Pull develop"; git fetch origin develop; git reset --hard origin/develop
          echo "[2/5] Install";      npm ci
          echo "[3/5] Build";        npm run build
          [ -f dist/index.js ] || { echo "ERROR: dist/index.js missing"; exit 1; }
          echo "[4/5] Prune";        npm prune --omit=dev
          # --update-env: the app is .env-driven via dotenv.config() (no override),
          # so a plain restart keeps any value pm2 cached in the process env and
          # ignores later .env edits. --update-env rebuilds the env so the current
          # .env wins (e.g. a rotated MIRROR_INTERNAL_SECRET / email creds).
          echo "[5/5] Restart staging PM2"; sudo pm2 restart ecosystem.staging.config.js --update-env
          sleep 15; sudo pm2 list | grep -E 'staging' || true
          DEPLOY

      - name: Report pending migrations (staging DB)
        continue-on-error: true
        run: |
          # Drift-aware: mirror-server migrations are applied PER FILE by a human
          # (docs/STAGING.md). CI only REPORTS pending here so a schema change is
          # never silently auto-applied. Apply pending files manually on staging,
          # then re-run acceptance.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd ${{ secrets.STAGING_DEPLOY_PATH }} && npm run migrate:status || true"

      - name: Verify staging PM2 processes online
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'CHECK'
          set -e
          OFFLINE=$(sudo pm2 jlist | python3 -c "
          import json,sys
          procs=json.load(sys.stdin)
          expected={'mirror-server-staging','analysis-worker-staging','dina-chat-worker-staging','truthstream-worker-staging','personal-analysis-worker-staging','email-campaign-worker-staging'}
          alive={p['name'] for p in procs if p['pm2_env']['status']=='online'}
          print(' '.join(expected-alive))
          ")
          if [ -n "$OFFLINE" ]; then echo "::error::Staging processes not online: $OFFLINE"; sudo pm2 list; exit 1; fi
          echo "All 6 staging PM2 processes online."
          CHECK

      - name: Staging health check
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'HEALTH'
          set -e
          for i in $(seq 1 12); do
            CODE=$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:9444/mirror/api/health || echo 000)
            [ "$CODE" = "200" ] && { echo "staging health OK"; exit 0; }
            echo "attempt $i: $CODE"; sleep 5
          done
          echo "::error::staging health check failed"; exit 1
          HEALTH

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # ===========================================================================
  # JOB 4: STAGING ACCEPTANCE  (staging pipeline gate 4)
  # ---------------------------------------------------------------------------
  # The real end-to-end gate: runs the Admin INTAKE SIMULATION against staging —
  # a full register -> entry submit -> merged read -> IDOR guard -> core store ->
  # teardown journey against the real staging DB and endpoints. If the sim run
  # comes back status='failed', staging is NOT good to promote. This is the gate
  # that would have caught the intake-storage regression before it shipped.
  # ===========================================================================
  staging-acceptance:
    name: Staging Acceptance (intake simulation)
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.STAGING_ENABLED == 'true'

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run intake simulation against staging
        run: |
          # Loopback call on the host to staging mirror-server's internal
          # simulation API (gated by MIRROR_INTERNAL_SECRET). That secret is a
          # RUNTIME admin<->mirror secret living in the staging server's .env —
          # NOT a CI secret. We read it from that .env over the SSH we already
          # have (single source of truth), rather than duplicating it into
          # GitHub where it would drift. dryRun=false, cleanup on (default).
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd '${{ secrets.STAGING_DEPLOY_PATH }}' && \
             SECRET=\$(node -e \"require('dotenv').config();process.stdout.write((process.env.MIRROR_INTERNAL_SECRET||'').trim())\") && \
             if [ -z \"\$SECRET\" ]; then echo '{\"data\":{\"status\":\"missing\"},\"error\":\"MIRROR_INTERNAL_SECRET absent in staging .env\"}'; exit 0; fi && \
             curl -sk -X POST https://127.0.0.1:9444/mirror/api/admin/simulation/intake/run \
               -H 'Content-Type: application/json' \
               -H \"x-internal-secret: \$SECRET\" \
               -H 'x-admin-user: ci-acceptance' \
               -d '{\"dryRun\":false,\"label\":\"ci-staging-acceptance\"}'" > sim.json
          echo "--- simulation report ---"; cat sim.json | python3 -m json.tool || cat sim.json
          STATUS=$(python3 -c "import json; print(json.load(open('sim.json')).get('data',{}).get('status','missing'))" 2>/dev/null || echo missing)
          echo "sim status: $STATUS"
          if [ "$STATUS" = "failed" ] || [ "$STATUS" = "missing" ]; then
            echo "::error::Staging acceptance FAILED — intake simulation status=$STATUS. Do not promote."
            exit 1
          fi
          echo "Staging acceptance passed (status=$STATUS)."

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
